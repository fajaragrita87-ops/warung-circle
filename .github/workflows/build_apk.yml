name: Build Warung Circle APK

on:
  push:
    branches: [main, master, agents/desain-sesuai-permintaan]
  pull_request:
    branches: [main, master, agents/desain-sesuai-permintaan]
  workflow_dispatch:  # allow manual trigger

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android build)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Analyze code (warn, not fail build)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      # 6. Run tests (if any)
      - name: Run tests
        run: flutter test || true

      # 7. Build APK per ABI
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # 8. Upload APK artifacts
      - name: Upload APK (ARM64 - Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: warung-circle-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK (ARM32 - Old devices)
        uses: actions/upload-artifact@v4
        with:
          name: warung-circle-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload APK (x86_64 - Emulator)
        uses: actions/upload-artifact@v4
        with:
          name: warung-circle-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      # 9. Create GitHub Release on tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          name: "Warung Circle ${{ github.ref_name }}"
          body: |
            ## 🎉 Warung Circle ${{ github.ref_name }}

            ### Download APK:
            - **warung-circle-arm64.apk** → Untuk HP Modern (2020+)
            - **warung-circle-arm32.apk** → Untuk HP Lama

            ### Cara Install:
            1. Download APK sesuai HP kamu
            2. Aktifkan "Install dari sumber tidak dikenal" di Pengaturan
            3. Buka file APK dan install
            4. Selamat nongkrong di Meja Warung! ☕🔥
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
