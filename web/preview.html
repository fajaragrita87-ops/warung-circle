<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Circle - Social Feed Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        
        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }
        
        p {
            color: #666;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #efefef;
            border-color: #999;
        }
        
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            text-align: left;
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
        
        .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">📱</div>
        <h1>Warung Circle</h1>
        <h2 style="margin: 0 0 20px 0; color: #667eea; font-size: 18px;">Social Feed Preview</h2>
        
        <p>Lihat design Social Feed yang sudah dibuat sesuai dengan mockup Anda.</p>
        
        <div class="button-group">
            <a href="social-feed-preview.html" class="btn-primary">👁️ Lihat Preview HTML</a>
            <a href="https://github.com" class="btn-secondary">📦 Download Flutter App</a>
        </div>
        
        <div class="info">
            <strong>✅ Preview HTML:</strong> Akses langsung design tanpa perlu install Flutter
            <br><br>
            <strong>📱 Flutter App:</strong> Build aplikasi Flutter di lokal dengan fitur lengkap
        </div>
    </div>
</body>
</html>
